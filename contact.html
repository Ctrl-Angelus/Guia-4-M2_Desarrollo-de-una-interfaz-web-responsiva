<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seoul way - Contact us</title>

    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" type="image/svg+xml" href="img/icon.svg">
</head>

<body>
    <header>
        <div class="logo">
            <span class="logo-icon">&#127836;</span>
            <div class="logo-container">
                <h1>Seoul way</h1>
                <span>서울의 방식</span>
            </div>
        </div>
        <button class="menu-toggle" aria-label="open menu" , aria-expanded="false" aria-controls="navigation">
            <img src="./img/menu.svg" alt="menu" class="icon-open">
            <img src="./img/x.svg" alt="close" class="icon-close">
        </button>
        <nav id="navigation">
            <a href="index.html" class="nav-linnk">
                <img src="img/home.svg" alt="Home" class="nav-icon">
                <span>Home</span>
            </a>
            <a href="about.html" class="nav-link">
                <img src="./img/info.svg" alt="about" class="nav-icon">
                <span>About</span>
            </a>
        </nav>
        <button id="dark-mode-toggle" aria-label="Cambiar entre modo claro y oscuro">
            <img src="./img/sun.svg" id="light-toggle">
            <img src="./img/moon.svg" id="dark-toggle">
        </button>
    </header>
    <main class="contact">
        <section class="form-content">
            <h2>Contact Us</h2>
            <form action="#" method="POST" class="form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="How can we help you?" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="submit">Send Message</button>
            </form>
        <section>    
    </main>
    <footer>
        <div class="footer-info">
            <p class="footer-project">Proyecto guía 4: Desarrollo de una interfaz web responsiva</p>
            <p>© 2026 Seoul Way · 서울의 방식</p>
            <p>Inventory's Management System</p>
        </div>

        <ul class="footer-authors">
            <li>Maria Antonia Posada Araujo</li>
            <li>Carlos Daniel Giraldo Naranjo</li>
            <li>Miguel Angel Ortiz Loaiza</li>
        </ul>

        <nav class="footer-links">
            <a href="https://github.com/Ctrl-Angelus/Guia-4-M2_Desarrollo-de-una-interfaz-web-responsiva"
                target="_blank" rel="noopener" aria-label="Repositorio en GitHub">
                <img src="./img/brand-github.svg" alt="" width="24" height="24">
            </a>
            <a href="https://github.com/Ctrl-Angelus/Guia-4-M2_Desarrollo-de-una-interfaz-web-responsiva/blob/master/README"
                target="_blank" rel="noopener">README</a>
        </nav>
    </footer>

    <script src="js/theme.js" defer></script>
</body>

</html>
